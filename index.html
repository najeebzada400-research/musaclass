<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Musa's Maths Grand Prix</title>
<meta name="theme-color" content="#2D3550">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root {
  --sky: #EEF6FF; --ink: #1B2440; --ink-soft: #4A5577; --asphalt: #2D3550; --asphalt-2: #3C4566;
  --asphalt-text: #DCE4F5; --lane: #FFC43D; --lane-deep: #B88400; --card: #FFFFFF; --line: #D3E1F1;
  --chip: #E4ECF6; --car: #D62839; --go: #177A45; --go-soft: #E3F6EC; --go-ink: #0F5530;
  --warn-soft: #FFF4D6; --warn-ink: #6B5200; --dot-muted: #5A6588; --mastered: #2BB673;
  --font-display: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 17px; font-weight: 600;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.display { font-family: var(--font-display); font-weight: 800; line-height: 1.05; text-wrap: balance; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-small { font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--ink-soft); line-height: 1; }
.brand-big { font-size: clamp(28px, 6vw, 38px); }
.driver { display: flex; align-items: center; gap: 10px; font-weight: 800; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--car); color: var(--card); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 26px; border: 4px solid var(--card); box-shadow: 0 2px 0 var(--line); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--card); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.stat b { font-family: var(--font-display); font-size: 26px; line-height: 1; display: block; }
.stat span { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.today { background: var(--asphalt); color: var(--card); border-radius: 28px; padding: 26px 26px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.today-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.tag { align-self: flex-start; background: var(--lane); color: var(--ink); font-weight: 800; font-size: 13px; letter-spacing: 0.06em; padding: 4px 12px; border-radius: 999px; }
.today h2 { font-size: clamp(30px, 6vw, 40px); margin: 6px 0; }
.today p { margin: 0; color: var(--asphalt-text); max-width: 420px; font-size: 17px; }
.go-btn { border: none; cursor: pointer; background: var(--lane); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 24px; padding: 14px 26px; border-radius: 20px; box-shadow: 0 5px 0 var(--lane-deep); display: inline-flex; align-items: center; gap: 10px; }
.go-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--lane-deep); }
.go-btn[disabled] { background: var(--chip); box-shadow: 0 5px 0 var(--line); color: var(--ink-soft); cursor: default; transform: none; }
.road { position: relative; height: 92px; margin: 0 -26px; }
.road .tarmac { position: absolute; left: 0; right: 0; bottom: 0; height: 38px; background: var(--asphalt-2); }
.road .dash { position: absolute; left: 0; right: 0; bottom: 17px; height: 4px; background: repeating-linear-gradient(90deg, var(--lane) 0 28px, transparent 28px 52px); }
.road > .car { position: absolute; left: 40px; bottom: 12px; }
.flag { position: absolute; right: 40px; bottom: 38px; width: 34px; height: 46px; border-radius: 3px; background: repeating-conic-gradient(var(--card) 0 25%, var(--ink) 0 50%) 0 0 / 12px 12px; }
.pole { position: absolute; right: 74px; bottom: 38px; width: 4px; height: 54px; background: var(--asphalt-text); }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.sec-head h3 { margin: 0; font-size: 24px; }
.sec-head span { color: var(--ink-soft); font-weight: 700; font-size: 15px; }
.bonus { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.bonus button { border: none; cursor: pointer; background: var(--card); border-radius: 18px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.bonus button b { font-family: var(--font-display); font-size: 18px; line-height: 1; }
.bonus button small { font-size: 13px; font-weight: 800; color: var(--go); }
.bonus button.locked { cursor: default; background: var(--chip); box-shadow: none; }
.bonus button.locked small { color: var(--ink-soft); }
.bonus button.done small { color: var(--lane-deep); }
.map { background: var(--asphalt); border-radius: 24px; padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 14px; }
.map-row { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; background: repeating-linear-gradient(90deg, var(--lane) 0 12px, transparent 12px 26px) 0 20px / 100% 3px no-repeat; }
.cp { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.cp i { font-style: normal; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 19px; }
.cp i.q { background: var(--lane); color: var(--ink); border: 3px solid var(--card); }
.cp i.m { background: var(--mastered); color: var(--ink); border: 3px solid var(--card); }
.cp i.c { background: var(--dot-muted); color: var(--card); border: 3px solid var(--dot-muted); }
.cp small { font-size: 11.5px; font-weight: 700; color: var(--asphalt-text); text-align: center; line-height: 1.2; }
.legend { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; font-size: 13px; font-weight: 700; color: var(--asphalt-text); }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.garage { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.up { background: var(--card); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 3px 0 var(--line); min-width: 0; border: none; text-align: left; }
.up .sw { height: 36px; border-radius: 10px; }
.up b { font-size: 15px; line-height: 1.15; }
.up small { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.up small.ok { color: var(--go); }
.studied { background: var(--card); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 0 var(--line); }
.studied h3 { margin: 0; font-size: 24px; }
.studied p { margin: 0; color: var(--ink-soft); }
.pick-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
.pick-grid.lessons { grid-template-columns: 1fr; }
.pick { border: 3px solid var(--line); background: #F4F8FD; border-radius: 14px; min-height: 52px; font-family: var(--font-display); font-weight: 800; font-size: 20px; cursor: pointer; }
.pick.on { background: var(--lane); border-color: var(--ink); }
.pick.lesson { text-align: left; font-family: var(--font-body); font-size: 16px; padding: 10px 14px; }
.race-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back { border: none; cursor: pointer; background: var(--card); border-radius: 16px; padding: 10px 16px; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; box-shadow: 0 3px 0 var(--line); }
.race-top .display { font-size: 22px; text-align: center; }
.track { position: relative; height: 104px; background: var(--asphalt); border-radius: 24px; overflow: hidden; }
.track .dash { position: absolute; left: 20px; right: 20px; top: 66px; height: 4px; background: repeating-linear-gradient(90deg, var(--lane) 0 22px, transparent 22px 40px); }
.track .flag { right: 22px; bottom: auto; top: 18px; }
.track .pole { right: 56px; bottom: auto; top: 18px; height: 66px; }
#carwrap { position: absolute; top: 30px; transition: left .6s cubic-bezier(.3,1.4,.5,1); }
@media (prefers-reduced-motion: reduce) { #carwrap { transition: none; } }
.qcard { background: var(--card); border-radius: 30px; padding: clamp(20px, 5vw, 36px); display: flex; flex-direction: column; gap: 24px; box-shadow: 0 6px 0 var(--line); }
.chip { align-self: flex-start; background: var(--chip); color: var(--asphalt); font-weight: 800; font-size: 14px; padding: 6px 14px; border-radius: 999px; }
.qtext { font-family: var(--font-display); font-weight: 700; font-size: clamp(26px, 5.4vw, 36px); line-height: 1.2; margin: 0; text-wrap: balance; white-space: pre-line; }
.visual { display: flex; justify-content: center; overflow-x: auto; }
.visual svg { max-width: 100%; height: auto; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.opt { cursor: pointer; font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 4.6vw, 34px); min-height: 92px; padding: 10px; border-radius: 22px; background: #F4F8FD; border: 4px solid var(--line); box-shadow: 0 5px 0 var(--line); line-height: 1.15; }
.opt.long { font-size: clamp(18px, 3.6vw, 24px); }
.opt.on { background: var(--lane); border-color: var(--ink); box-shadow: 0 5px 0 var(--lane-deep); }
.entry { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.screen { min-width: 220px; max-width: 100%; min-height: 76px; padding: 8px 22px; border-radius: 20px; border: 4px solid var(--line); background: #F4F8FD; font-family: var(--font-display); font-weight: 800; font-size: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; font-variant-numeric: tabular-nums; }
.screen .ph { color: var(--ink-soft); font-size: 22px; font-weight: 700; }
.screen .unit { font-size: 26px; color: var(--ink-soft); }
.pad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(100%, 360px); }
.key { cursor: pointer; border: none; min-height: 64px; border-radius: 18px; background: var(--chip); box-shadow: 0 4px 0 var(--line); font-family: var(--font-display); font-weight: 800; font-size: 30px; }
.key.fn { font-family: var(--font-body); font-size: 17px; }
.key:active, .opt:active, .pick:active { transform: translateY(3px); }
.hint { text-align: center; color: var(--ink-soft); font-weight: 700; margin: 0; }
.next { width: 100%; justify-content: center; font-size: 28px; padding: 18px; }
.checker { height: 32px; border-radius: 12px; background: repeating-conic-gradient(var(--card) 0 25%, var(--ink) 0 50%) 0 0 / 32px 32px; }
.finish-title { font-size: clamp(44px, 9vw, 62px); text-align: center; margin: 4px 0 0; }
.finish-sub { text-align: center; color: var(--ink-soft); font-size: 20px; margin: 0; }
.prize { background: var(--card); border-radius: 28px; padding: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 5px 0 var(--line); text-align: center; }
.stars { display: flex; gap: 10px; }
.stars svg { animation: pop 0.5s ease-out both; }
.stars svg:nth-child(2) { animation-delay: 0.15s; }
.stars svg:nth-child(3) { animation-delay: 0.3s; }
@keyframes pop { from { transform: scale(0.4); } to { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .stars svg { animation: none; } }
.prize h2 { margin: 0; font-size: 30px; }
.prize p { margin: 0; color: var(--ink-soft); max-width: 480px; font-size: 18px; }
.pill { background: var(--sky); border-radius: 999px; padding: 8px 18px; font-weight: 800; }
.saved { font-size: 14px; color: var(--ink-soft); font-weight: 700; }
.fact { background: var(--warn-soft); border-radius: 22px; padding: 18px 22px; display: flex; gap: 14px; align-items: center; }
.fact b { font-family: var(--font-display); font-size: 19px; display: block; }
.tip { background: var(--card); border-radius: 26px; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 5px 0 var(--line); }
.tip h3 { margin: 0; font-size: 26px; }
.qa { display: flex; gap: 12px; flex-wrap: wrap; }
.qa div { border-radius: 16px; padding: 10px 16px; }
.qa small { display: block; font-size: 13px; font-weight: 800; color: var(--ink-soft); letter-spacing: 0.04em; }
.qa b { font-family: var(--font-display); font-size: 24px; }
.step { display: flex; gap: 12px; align-items: flex-start; font-size: 18px; font-weight: 700; }
.step i { font-style: normal; width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: var(--asphalt); color: var(--card); display: grid; place-items: center; font-weight: 800; }
.try { border-top: 3px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.try-row { display: flex; gap: 10px; flex-wrap: wrap; }
.try-row .opt { min-height: 60px; flex: 1 1 120px; font-size: 22px; }
.result { border-radius: 14px; padding: 12px 16px; font-weight: 700; }
.result.good { background: var(--go-soft); color: var(--go-ink); }
.result.mid { background: var(--warn-soft); color: var(--warn-ink); }
.strong { background: var(--go-soft); border-radius: 22px; padding: 18px 22px; display: flex; gap: 14px; align-items: center; }
.strong b { font-family: var(--font-display); font-size: 19px; color: var(--go-ink); display: block; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.plain-btn { border: none; cursor: pointer; background: var(--card); color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 22px; padding: 16px; border-radius: 20px; box-shadow: 0 5px 0 var(--line); }
.two .go-btn { justify-content: center; font-size: 22px; }
.loading { text-align: center; padding: 60px 10px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.loading .display { font-size: 30px; }
@media (max-width: 560px) {
  .bonus { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .garage { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .map-row { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 12px; background: none; }
  .pick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .opts { grid-template-columns: 1fr; }
  .stat { flex-direction: column; align-items: flex-start; gap: 4px; }
}
</style>

  var CH = ['', 'Place value', 'Negative numbers', 'Factors and multiples', 'Time', '2D shapes', '3D shapes', 'Area and perimeter',

  var LESSONS = {

  };
  var FACTS = [

    'A Formula 1 car can go from 0 to 100 km/h in under 3 seconds.',

  var UPGRADES = [

  /* ---------- storage (best effort) ---------- */

  function apiPost(body) {

  }

  function starsTotal() {
    var server = stats ? stats.stars : 0;
    return server + L.queue.filter(function (i) { return i.action === 'race'; }).length * 3;

    var d = {};

    return d;
  }

    flushQueue().catch(function () {}).then(function () { return apiGet(); }).then(function (res) {
      if (!res || !res.ok || !res.plan) throw new Error('no plan');
      plan = res.plan; stats = res.stats || null;
      try { localStorage.setItem(KEY + '-plan', JSON.stringify({ plan: plan, stats: stats })); } catch (e) {}
      goView('home');
    }).catch(function () {
      var cached = null;
      try { cached = JSON.parse(localStorage.getItem(KEY + '-plan')); } catch (e) {}
      if (cached && cached.plan) { plan = cached.plan; stats = cached.stats; goView('home'); }
      else renderError('The pit lane is out of reach');
    });
  }
  boot();
})();
</script>
</body>
</html>
